# dsh-claude host bundle. The preset stays inside this package as a system
# preset, so removing the profile dependency removes the complete integration.
- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(ctx.baseUrl).resolve('@norman-else/dsh-claude/package.json')), 'preset')"
        trust: system

# The access selector's entries ARE this table, and its sandbox knob spans only
# three of Claude Code's six permission modes. The three upstream presets keep
# their keys (and their glyphs); the rest name a Claude mode of their own, which
# the plugin's `permissionModes` maps back. Every added preset stays on
# `approval: ask` -- `never` auto-rejects every DSH approval, which is fine
# behind bypassPermissions and a dead agent anywhere else.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      claude-dont-ask:
        sandbox: workspace-write
        approval: ask
        name: Allowlist Only
        description: Run what the Claude settings allowlist already permits and deny the rest, without prompting.
      claude-ask:
        sandbox: workspace-write
        approval: ask
        name: Ask Every Time
        description: Ask before every tool, file edits included.
      claude-auto:
        sandbox: workspace-write
        approval: ask
        name: Auto Approve
        description: A model classifier answers the permission prompts; anything it escalates still asks.
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- insert:
    - id: llm-claude
      name: '@norman-else/dsh-claude'
      config:
        # Claude modes the sandbox knob cannot express, claimed by preset name.
        permissionModes:
          claude-ask: default
          claude-auto: auto
          claude-dont-ask: dontAsk
